<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI文案工坊 V3.0 - 企业版</title>
<style>
:root {
  --bg: #0a0a0f; --card: #13131a; --primary: #6c5ce7;
  --accent: #00cec9; --text: #e8e8f0; --text-dim: #8888a0;
  --border: #2a2a3a; --success: #00b894; --warning: #fdcb6e; --danger: #ff7675;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
.bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 20% 20%, rgba(108,92,231,0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(0,206,201,0.1) 0%, transparent 50%); z-index: -1; }

header { padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 50; }
.logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
.version-badge { background: var(--accent); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 700; margin-left: 5px; }
.user-panel { display: flex; align-items: center; gap: 15px; }
.user-info { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-dim); }
.user-info span { color: var(--text); font-weight: 600; }
.limit-badge { background: var(--border); padding: 2px 8px; border-radius: 10px; font-size: 11px; }
.limit-badge.low { background: var(--danger); color: #fff; }

.btn { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: #5b4bd6; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-danger { background: var(--danger); color: #fff; }

.container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
.card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); padding: 24px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
.card h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 14px; outline: none; }
.form-group textarea { height: 100px; resize: vertical; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

.output-area { background: var(--bg); border-radius: 8px; padding: 15px; min-height: 150px; max-height: 60vh; overflow-y: auto; 
    white-space: pre-wrap; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.6; font-size: 14px; 
    border: 1px solid var(--border); position: relative; width: 100%; box-sizing: border-box; overflow-x: hidden; }
.output-area pre { margin: 0; white-space: pre-wrap !important; word-break: break-all !important; overflow-wrap: break-word !important; width: 100%; box-sizing: border-box; }

/* Result Header & Actions */
.result-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; color: var(--text-dim); flex-wrap: wrap; gap: 8px; }
.result-header span { margin-right: 10px; }
.result-header .tag { background: var(--border); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
.action-bar { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
.loading { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; color: var(--accent); }

/* Modal */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card); padding: 30px; border-radius: 16px; width: 90%; max-width: 400px; border: 1px solid var(--border); }
.modal h3 { font-size: 20px; margin-bottom: 20px; text-align: center; }
.modal .error-msg { color: var(--danger); font-size: 12px; margin-top: 5px; display: none; }
.modal-switch { text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-dim); }
.modal-switch a { color: var(--accent); cursor: pointer; text-decoration: underline; }

/* Payment Modal Specifics */
.plan-option { border: 1px solid var(--border); border-radius: 8px; padding: 15px; margin-bottom: 10px; cursor: pointer; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; }
.plan-option:hover, .plan-option.selected { border-color: var(--primary); background: rgba(108,92,231,0.1); }
.plan-name { font-weight: bold; font-size: 16px; }
.plan-price { color: var(--success); font-weight: bold; font-size: 18px; }
.plan-desc { font-size: 12px; color: var(--text-dim); margin-top: 5px; }
</style>
</head>
<body>

<div class="bg-gradient"></div>

<header>
    <div class="logo">
        <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center">🔥</div>
        AI文案工坊
        <span class="version-badge">V3.0.0</span>
    </div>
    <div class="user-panel">
        <div id="guest-panel">
            <button class="btn btn-primary" onclick="showModal()">登录 / 注册</button>
        </div>
        <div id="user-panel" style="display: none;">
            <div class="user-info">
                <span id="username-display">User</span>
                <span class="limit-badge" id="limit-display">--/--</span>
            </div>
            <button class="btn btn-outline" style="border-color: var(--success); color: var(--success);" onclick="showPaymentModal()">💎 升级</button>
            <button class="btn btn-outline" onclick="logout()">退出</button>
        </div>
    </div>
</header>

<div class="container">
    <div class="card">
        <h2>✨ 智能文案生成</h2>
        <div class="form-row">
            <div class="form-group">
                <label>文案场景</label>
                <select id="scene">
                    <option value="xiaohongshu">📕 小红书种草</option>
                    <option value="gongzhonghao">📑 公众号文章</option>
                    <option value="shipinhao">🎥 视频号脚本</option>
                    <option value="pengyouquan">💬 朋友圈文案</option>
                    <option value="dianping">⭐ 大众点评好评</option>
                    <option value="zhihu">🎓 知乎回答</option>
                    <option value="expert_access">💊 医药准入专家 (集采/医保)</option>
                </select>
            </div>
            <div class="form-group">
                <label>AI 模型</label>
                <select id="model">
                    <option value="deepseek">🚀 DeepSeek V3 (通用最强)</option>
                    <option value="token-plan-qwen">🧠 Qwen3.6-Plus (逻辑推理)</option>
                    <option value="token-plan-glm">⚡ GLM-5 (智谱)</option>
                    <option value="token-plan-minimax">🎤 MiniMax-M2.5 (极速)</option>
                </select>
            </div>
        </div>
        <div class="form-group">
            <label>主题 / 关键词</label>
            <input type="text" id="topic" placeholder="例如：新品发布、年中大促、防脱发洗发水测评...">
        </div>
        <div class="form-group">
            <label>补充要求 (可选)</label>
            <textarea id="requirements" placeholder="例如：语气要活泼，多用 Emoji，强调性价比..."></textarea>
        </div>
        <button class="btn btn-primary" style="width: 100%; padding: 12px;" onclick="generate()" id="gen-btn">立即生成文案</button>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <h2 style="margin: 0;">📝 生成结果</h2>
            <!-- V2 功能回归：元数据 (耗时、模型) -->
            <div id="result-meta" style="font-size: 12px; color: var(--text-dim); display: none;">
                <span id="meta-time" style="margin-right: 8px;">⏱️ 0s</span>
                <span id="meta-model">🤖 -</span>
            </div>
        </div>
        
        <div class="output-area" id="output">
            <div style="color: var(--text-dim); text-align: center; margin-top: 40px;">
                文案将在这里显示...
            </div>
        </div>

        <!-- V2 功能回归：操作栏 -->
        <div id="result-actions" style="display: none; margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end;">
            <button class="btn btn-outline" onclick="copyContent()" id="copy-btn">📋 一键复制</button>
            <button class="btn btn-primary" onclick="regenerate()" id="regen-btn">🔄 重新生成</button>
        </div>
    </div>
</div>

<!-- V3.2 History Card -->
<div class="container" id="history-container" style="display: none;">
    <div class="card">
        <h2>📜 我的文案 <span style="font-size: 12px; color: var(--text-dim); font-weight: normal;">(历史记录)</span></h2>
        <div id="history-list" style="min-height: 100px; padding: 10px; color: var(--text-dim);">加载中...</div>
        <div style="text-align: center; margin-top: 15px;">
            <button class="btn btn-outline btn-sm" id="load-more-btn" onclick="loadMoreHistory()" style="display: none;">加载更多</button>
        </div>
    </div>
</div>

<!-- Auth Modal -->
<div class="modal-overlay" id="auth-modal">
    <div class="modal">
        <h3 id="modal-title">用户登录</h3>
        <div class="form-group">
            <label>用户名</label>
            <input type="text" id="auth-user" placeholder="请输入用户名">
        </div>
        <div class="form-group" id="email-group" style="display: none;">
            <label>邮箱 (注册需要)</label>
            <input type="email" id="auth-email" placeholder="user@example.com">
        </div>
        <div class="form-group">
            <label>密码</label>
            <input type="password" id="auth-pass" placeholder="请输入密码">
        </div>
        <p class="error-msg" id="auth-error"></p>
        <button class="btn btn-primary" style="width: 100%;" onclick="handleAuth()" id="auth-btn">登录</button>
        <div class="modal-switch">
            <span id="switch-text">还没有账号？</span> <a onclick="toggleAuthMode()">注册</a>
        </div>
        <div class="modal-switch" style="margin-top: 10px;"><a onclick="closeModal()">取消</a></div>
    </div>
</div>

<!-- Payment Modal -->
<div class="modal-overlay" id="payment-modal">
    <div class="modal" style="max-width: 500px;">
        <h3>💎 升级套餐</h3>
        <div id="payment-step-1">
            <div class="plan-option" onclick="selectPlan(this, 'pro_monthly', '9.9')">
                <div>
                    <div class="plan-name">Pro 月卡</div>
                    <div class="plan-desc">每日 50 次额度 • 优先响应</div>
                </div>
                <div class="plan-price">¥9.9</div>
            </div>
            <div class="plan-option" onclick="selectPlan(this, 'pro_yearly', '79.0')">
                <div>
                    <div class="plan-name">Pro 年卡</div>
                    <div class="plan-desc">每日 100 次额度 • 全年特惠</div>
                </div>
                <div class="plan-price">¥79.0</div>
            </div>
            
            <div style="margin-top: 20px; text-align: right;">
                <button class="btn btn-outline" onclick="closePaymentModal()">取消</button>
                <button class="btn btn-primary" id="pay-btn" onclick="createOrder()" disabled>立即支付</button>
            </div>
        </div>

        <div id="payment-step-2" style="display: none; text-align: center;">
            <p>订单已创建，请支付：</p>
            <div style="background: white; padding: 10px; border-radius: 8px; margin: 15px 0; display: inline-block;">
                <img id="qr-image" src="" alt="QR Code" style="width: 200px; height: 200px;">
            </div>
            <p style="color: var(--text-dim); font-size: 12px;">订单号: <span id="order-no-display"></span></p>
            
            <hr style="border: 0; border-top: 1px solid var(--border); margin: 20px 0;">
            <p style="font-size: 12px; color: var(--warning);">💡 模拟测试模式：</p>
            <button class="btn btn-outline" style="border-color: var(--success); color: var(--success);" onclick="simulatePay()">🛠️ 模拟支付成功 (回调)</button>
        </div>
    </div>
</div>

<script>
// State
let isLoginMode = true;
let userToken = localStorage.getItem('ai_token');
let userInfo = null;

// Init
window.onload = () => {
    if (userToken) checkUserStatus();
};

// UI Functions
function showModal() { document.getElementById('auth-modal').classList.add('active'); resetAuthForm(); }
function closeModal() { document.getElementById('auth-modal').classList.remove('active'); }
function toggleAuthMode() {
    isLoginMode = !isLoginMode;
    document.getElementById('modal-title').innerText = isLoginMode ? '用户登录' : '新用户注册';
    document.getElementById('auth-btn').innerText = isLoginMode ? '登录' : '注册';
    document.getElementById('email-group').style.display = isLoginMode ? 'none' : 'block';
    document.getElementById('switch-text').innerText = isLoginMode ? '还没有账号？' : '已有账号？';
    resetAuthForm();
}
function resetAuthForm() {
    document.getElementById('auth-error').style.display = 'none';
    document.querySelectorAll('.modal input').forEach(i => i.value = '');
}

// Auth Logic
async function handleAuth() {
    const u = document.getElementById('auth-user').value;
    const p = document.getElementById('auth-pass').value;
    const e = document.getElementById('auth-email').value;
    const errBox = document.getElementById('auth-error');
    
    if (!u || !p) { showError('请填写用户名和密码'); return; }
    if (!isLoginMode && !e) { showError('注册需要填写邮箱'); return; }

    const endpoint = isLoginMode ? '/api/auth/login' : '/api/auth/register';
    const body = isLoginMode ? { username: u, password: p } : { username: u, email: e, password: p };

    try {
        const res = await fetch(endpoint, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
        const data = await res.json();
        
        if (data.success) {
            userToken = data.token;
            localStorage.setItem('ai_token', userToken);
            closeModal();
            checkUserStatus();
        } else {
            showError(data.error || '操作失败');
        }
    } catch (err) { showError('网络连接失败'); }
}

async function checkUserStatus() {
    try {
        const res = await fetch('/api/auth/profile', { headers: {'Authorization': `Bearer ${userToken}`} });
        if (res.ok) {
            const data = await res.json();
            userInfo = {
                username: data.user?.username || 'User',
                role: data.user?.role || 'user',
                today_usage: data.usage?.today_count || 0,
                daily_limit: data.subscription?.daily_limit || 10,
                plan_type: data.subscription?.plan_type || 'free',
                remaining: data.usage?.remaining || 0
            };
            updateUI(true);
        } else {
            logout();
        }
    } catch (e) { logout(); }
}

// 生成成功后刷新额度
async function refreshProfile() {
    try {
        const res = await fetch('/api/auth/profile', { headers: {'Authorization': `Bearer ${userToken}`} });
        if (res.ok) {
            const data = await res.json();
            userInfo = {
                username: data.user?.username || userInfo?.username || 'User',
                role: data.user?.role || 'user',
                today_usage: data.usage?.today_count || 0,
                daily_limit: data.subscription?.daily_limit || 10,
                plan_type: data.subscription?.plan_type || 'free',
                remaining: data.usage?.remaining || 0
            };
            updateLimitDisplay();
        }
    } catch (e) { /* 静默失败，不影响主流程 */ }
}

// ==================== V3.2 History Logic ====================
let historyPage = 1;
let historyLoading = false;

function updateUI(loggedIn) {
    document.getElementById('guest-panel').style.display = loggedIn ? 'none' : 'block';
    document.getElementById('user-panel').style.display = loggedIn ? 'flex' : 'none';
    
    // Show History card if logged in
    const histContainer = document.getElementById('history-container');
    if (histContainer) {
        histContainer.style.display = loggedIn ? 'block' : 'none';
        if (loggedIn && historyPage === 1) {
            loadHistory(1); // Load first page
        }
    }

    if (loggedIn && userInfo) {
        document.getElementById('username-display').innerText = userInfo.username;
        updateLimitDisplay();
    }
}

async function loadHistory(page, append = false) {
    if (historyLoading) return;
    historyLoading = true;
    const list = document.getElementById('history-list');
    const loadMoreBtn = document.getElementById('load-more-btn');
    
    if (!append) {
        list.innerHTML = '<div style="text-align:center; padding: 20px;">加载中...</div>';
        loadMoreBtn.style.display = 'none';
    } else {
        loadMoreBtn.innerText = '加载中...';
    }

    try {
        const res = await fetch(`/api/history?page=${page}&limit=10`, { 
            headers: {'Authorization': `Bearer ${userToken}`} 
        });
        const data = await res.json();
        
        if (data.success && data.items.length > 0) {
            if (!append) list.innerHTML = '';
            
            data.items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.style.cssText = 'border: 1px solid var(--border); padding: 12px; margin-bottom: 10px; border-radius: 8px; background: var(--bg); cursor: pointer; transition: 0.2s;';
                div.onmouseover = () => div.style.borderColor = 'var(--primary)';
                div.onmouseout = () => div.style.borderColor = 'var(--border)';
                div.onclick = () => restoreHistory(item);
                
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom: 5px;">
                        <strong style="color: var(--accent);">${item.title}</strong>
                        <span style="font-size: 11px; color: var(--text-dim);">${item.created_at.replace('T', ' ').substring(0, 16)}</span>
                    </div>
                    <div style="font-size: 12px; color: var(--text-dim); margin-bottom: 5px;">
                        场景: ${item.scene} | 模型: ${item.model || '-'}
                    </div>
                    <div style="font-size: 13px; color: var(--text); line-height: 1.4; max-height: 40px; overflow: hidden; text-overflow: ellipsis;">
                        ${item.content_preview}
                    </div>
                `;
                list.appendChild(div);
            });

            if (data.items.length >= 10) {
                loadMoreBtn.style.display = 'inline-block';
                loadMoreBtn.innerText = '加载更多';
                historyPage = page + 1;
            } else {
                loadMoreBtn.style.display = 'none';
            }
        } else {
            if (!append) list.innerHTML = '<div style="text-align:center; padding: 20px;">暂无历史记录</div>';
            loadMoreBtn.style.display = 'none';
        }
    } catch (e) {
        if (!append) list.innerHTML = '加载失败';
    } finally {
        historyLoading = false;
    }
}

function loadMoreHistory() {
    loadHistory(historyPage, true);
}

function restoreHistory(item) {
    // Put content in main output area
    document.getElementById('output').textContent = item.content_full;
    document.getElementById('result-meta').style.display = 'flex';
    document.getElementById('result-actions').style.display = 'flex';
    document.getElementById('meta-time').innerText = '历史生成';
    document.getElementById('meta-model').innerText = item.model || '';
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
    alert('文案已回填到上方，您可以直接复制！');
}

function logout() {
    userToken = null;
    userInfo = null;
    localStorage.removeItem('ai_token');
    updateUI(false);
}

function updateUI(loggedIn) {
    document.getElementById('guest-panel').style.display = loggedIn ? 'none' : 'block';
    document.getElementById('user-panel').style.display = loggedIn ? 'flex' : 'none';
    if (loggedIn && userInfo) {
        document.getElementById('username-display').innerText = userInfo.username;
        updateLimitDisplay();
    }
}

function updateLimitDisplay() {
    if (!userInfo) return;
    const used = userInfo.today_usage || 0;
    const limit = userInfo.daily_limit || 10;
    const el = document.getElementById('limit-display');
    el.innerText = `${used}/${limit}`;
    if (used >= limit) {
        el.classList.add('low');
        el.innerText = '额度已用完';
    }
}

// Core Generate Logic
async function generate() {
    // 1. 未登录拦截
    if (!userToken) {
        alert('请先登录后再生成，未登录无法使用！');
        showModal();
        return;
    }

    // 2. [新增] 额度用完拦截 - 绝不浪费 Token
    if (userInfo && userInfo.remaining <= 0) {
        alert(`今日额度已用完 (0/${userInfo.daily_limit})。请升级套餐获取更多额度，或明日再试！`);
        return;
    }

    const topic = document.getElementById('topic').value;
    if (!topic) { alert('请输入主题'); return; }

    const btn = document.getElementById('gen-btn');
    const output = document.getElementById('output');
    
    btn.disabled = true;
    btn.innerText = '正在生成中...';
    output.innerHTML = '<div class="loading">AI 正在思考中...</div>';

    // 隐藏元数据和操作栏
    document.getElementById('result-meta').style.display = 'none';
    document.getElementById('result-actions').style.display = 'none';

    // V2 功能回归：记录开始时间
    const startTime = Date.now();

    try {
        const headers = { 'Content-Type': 'application/json' };
        if (userToken) headers['Authorization'] = `Bearer ${userToken}`;

        const res = await fetch('/api/generate', {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
                topic: topic,
                scene: document.getElementById('scene').value,
                model: document.getElementById('model').value,
                requirements: document.getElementById('requirements').value
            })
        });

        const data = await res.json();
        
        if (data.success) {
            // 计算耗时
            const duration = ((Date.now() - startTime) / 1000).toFixed(1);
            
            // V2 功能回归：更新显示元数据和操作栏
            document.getElementById('meta-time').innerHTML = `⏱️ ${duration}s`;
            document.getElementById('meta-model').innerHTML = `🤖 ${data.model || '-'}`;
            document.getElementById('result-meta').style.display = 'flex';
            document.getElementById('result-actions').style.display = 'flex';

            // 渲染内容：使用 textContent 替代 pre 标签，避免不换行
            output.innerHTML = '';
            output.textContent = data.content;
            
            if (userToken) await refreshProfile();
        } else {
            output.textContent = data.error;
        }
    } catch (e) {
        output.textContent = '生成失败，请检查网络';
    } finally {
        btn.disabled = false;
        btn.innerText = '生成文案';
    }
}

// V2 功能回归：一键复制
function copyContent() {
    const content = document.getElementById('output').textContent;
    navigator.clipboard.writeText(content).then(() => {
        const btn = document.getElementById('copy-btn');
        const orig = btn.innerHTML;
        btn.innerHTML = '✅ 已复制';
        setTimeout(() => btn.innerHTML = orig, 2000);
    });
}

// V2 功能回归：重新生成
function regenerate() {
    document.getElementById('gen-btn').click();
}

// Payment Logic
let currentOrder = null;
let selectedPlan = null;

function showPaymentModal() { document.getElementById('payment-modal').classList.add('active'); }
function closePaymentModal() { 
    document.getElementById('payment-modal').classList.remove('active'); 
    document.getElementById('payment-step-1').style.display = 'block';
    document.getElementById('payment-step-2').style.display = 'none';
    selectedPlan = null;
}

function selectPlan(el, planId, price) {
    document.querySelectorAll('.plan-option').forEach(p => p.classList.remove('selected'));
    el.classList.add('selected');
    selectedPlan = { id: planId, price: price };
    document.getElementById('pay-btn').disabled = false;
    document.getElementById('pay-btn').innerText = `支付 ¥${price}`;
}

async function createOrder() {
    if (!selectedPlan) return;
    const btn = document.getElementById('pay-btn');
    btn.innerText = '创建订单中...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/payment/wechat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${userToken}` },
            body: JSON.stringify({ product: selectedPlan.id })
        });
        const data = await res.json();
        
        if (data.success) {
            currentOrder = data.data;
            document.getElementById('payment-step-1').style.display = 'none';
            document.getElementById('payment-step-2').style.display = 'block';
            
            if (currentOrder.qr_code) {
                document.getElementById('qr-image').src = currentOrder.qr_code;
            }
            document.getElementById('order-no-display').innerText = currentOrder.order_no;
        } else {
            alert('创建订单失败');
        }
    } catch (e) { alert('网络错误'); }
    finally { btn.disabled = false; }
}

async function simulatePay() {
    if (!currentOrder) return;
    const btn = document.querySelector('#payment-step-2 button');
    btn.innerText = '处理回调中...';
    btn.disabled = true;

    try {
        const res = await fetch('/api/payment/simulate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ order_no: currentOrder.order_no })
        });
        const data = await res.json();
        
        if (data.success) {
            alert('🎉 支付成功！权益已到账！');
            closePaymentModal();
            if (userToken) refreshProfile();
        } else {
            alert('回调失败: ' + data.error);
        }
    } catch (e) { alert('网络错误'); }
    finally { btn.disabled = false; }
}

function showError(msg) {
    const el = document.getElementById('auth-error');
    el.innerText = msg;
    el.style.display = 'block';
}
</script>
