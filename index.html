<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 医药顾问 V4.2 - 可视化版</title>
<!-- Markdown 渲染 -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- 图表可视化引擎 Mermaid -->
<script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
<script>mermaid.initialize({ startOnLoad: false, theme: 'dark' });</script>
<style>
:root {
  --bg: #0a0a0f; --card: #13131a; --primary: #6c5ce7;
  --accent: #00cec9; --text: #e8e8f0; --text-dim: #8888a0;
  --border: #2a2a3a; --success: #00b894; --warning: #fdcb6e; --danger: #ff7675;
  --step-active: #6c5ce7; --step-done: #00b894; --step-wait: #3a3a4a;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
.bg-gradient { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(ellipse at 20% 20%, rgba(108,92,231,0.15) 0%, transparent 50%), radial-gradient(ellipse at 80% 80%, rgba(0,206,201,0.1) 0%, transparent 50%); z-index: -1; }

header { padding: 10px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); background: rgba(10,10,15,0.95); z-index: 50; }
.logo { font-size: 18px; font-weight: 700; color: var(--accent); }

/* V4.1 咨询流程导航 */
.consultation-flow { display: flex; justify-content: space-between; padding: 15px 40px; background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--border); }
.step { display: flex; flex-direction: column; align-items: center; gap: 8px; width: 22%; position: relative; }
.step-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--step-wait); color: var(--text-dim); border: 2px solid transparent; font-size: 14px; font-weight: bold; transition: all 0.3s; z-index: 2; }
.step.active .step-circle { background: var(--primary); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(108,92,231,0.5); transform: scale(1.1); }
.step.done .step-circle { background: var(--success); color: #fff; border-color: var(--success); }
.step-label { font-size: 13px; color: var(--text-dim); font-weight: 500; text-align: center; transition: color 0.3s; }
.step.active .step-label { color: var(--text); }
.step-desc { font-size: 10px; color: var(--text-dim); text-align: center; max-width: 150px; line-height: 1.3; margin-top: 2px; }
/* 连线 */
.step:not(:last-child)::after { content: ''; position: absolute; top: 16px; left: 55%; width: 90%; height: 2px; background: var(--step-wait); z-index: 1; transition: background 0.3s; }
.step.done:not(:last-child)::after { background: var(--success); }

.container { flex: 1; display: flex; overflow: hidden; }

/* 左侧：对话区 */
.chat-panel { width: 40%; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: rgba(255,255,255,0.02); }
.chat-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600; background: rgba(0,0,0,0.2); display: flex; align-items: center; gap: 10px; }
.chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }

.message { max-width: 90%; padding: 12px 15px; border-radius: 12px; line-height: 1.5; font-size: 14px; position: relative; }
.msg-ai { background: var(--card); border: 1px solid var(--border); align-self: flex-start; }
.msg-user { background: var(--primary); color: #fff; align-self: flex-end; border-bottom-right-radius: 2px; }

.expert-tip { background: rgba(108,92,231,0.1); border-left: 3px solid var(--primary); padding: 8px 12px; margin-top: 8px; font-size: 12px; color: var(--text-dim); font-style: italic; border-radius: 0 4px 4px 0; }

.thinking-log { font-family: 'Consolas', monospace; font-size: 11px; color: var(--accent); padding: 5px 0; opacity: 0.8; }

.chat-input-area { padding: 15px; border-top: 1px solid var(--border); background: var(--card); display: flex; gap: 10px; }
.chat-input { flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); outline: none; }
.send-btn { padding: 0 20px; background: var(--accent); color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
.send-btn:disabled { background: var(--step-wait); color: var(--text-dim); cursor: not-allowed; }

/* 右侧：报告区 */
.report-panel { width: 60%; display: flex; flex-direction: column; background: var(--bg); }
.report-header { padding: 15px; border-bottom: 1px solid var(--border); font-weight: 600; background: rgba(0,0,0,0.2); display: flex; justify-content: space-between; }
.report-content { flex: 1; padding: 30px; overflow-y: auto; }
.report-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); text-align: center; }

/* Markdown 样式增强 & 图表容器 */
.report-content h3 { color: var(--accent); border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-top: 30px; }
.report-content table { width: 100%; border-collapse: collapse; margin: 15px 0; font-size: 13px; }
.report-content th, .report-content td { border: 1px solid var(--border); padding: 10px; text-align: left; }
.report-content th { background: rgba(108,92,231,0.15); color: var(--accent); font-weight: 600; }
.mermaid { background: rgba(255,255,255,0.03); border-radius: 8px; padding: 10px; margin: 15px 0; text-align: center; border: 1px solid var(--border); }
#flow-chart-box { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 8px; margin-bottom: 20px; min-height: 100px; display: flex; align-items: center; justify-content: center; }

/* 按钮样式 */
.action-btn { 
    background: var(--card); 
    border: 1px solid var(--border); 
    color: var(--text); 
    padding: 4px 10px; 
    border-radius: 4px; 
    font-size: 12px; 
    cursor: pointer; 
    transition: all 0.2s;
}
.action-btn:hover { background: var(--primary); border-color: var(--primary); }

/* 打印样式：导出 PDF 专用 */
@media print {
    body { background: #fff !important; color: #000 !important; height: auto !important; overflow: visible !important; display: block !important; }
    .bg-gradient, .chat-panel, .consultation-flow, .chat-input-area, header, .action-btn, #report-placeholder { display: none !important; }
    .report-panel { width: 100% !important; background: #fff !important; display: block !important; }
    .report-header { background: #fff !important; color: #000 !important; border-bottom: 2px solid #000 !important; padding: 20px 0 !important; }
    .report-header span:first-child { font-size: 24px !important; color: #000 !important; }
    .report-content { padding: 20px 0 !important; overflow: visible !important; color: #000 !important; }
    .report-content h3 { color: #000 !important; border-bottom: 1px solid #000 !important; }
    .report-content table { border: 1px solid #000 !important; }
    .report-content th, .report-content td { border: 1px solid #000 !important; color: #000 !important; background: #fff !important; }
    .report-content th { background: #eee !important; }
    .mermaid { background: #fff !important; border: 1px solid #ccc !important; }
    .expert-tip { display: none !important; } /* 打印时隐藏提示，只保留干货 */
}

/* 历史记录弹窗 */
.modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 1000; }
.modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; width: 500px; max-height: 70vh; display: flex; flex-direction: column; }
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.modal-header h3 { color: var(--accent); }
.close-btn { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; }
.history-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
.history-item { padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; }
.history-item:hover { background: rgba(108,92,231,0.1); border-color: var(--primary); }
</style>
</head>
<body>

<div class="bg-gradient"></div>

<header>
    <div class="logo">🏥 AI 医药顾问 <span style="font-size: 12px; color: var(--text-dim); font-weight: normal;">| V4.2 可视化决策引擎</span></div>
    <div>
        <button class="btn" style="background: transparent; border: 1px solid var(--border); color: var(--text); padding: 5px 10px; border-radius: 6px; cursor: pointer;" onclick="location.reload()">重置咨询</button>
    </div>
</header>

<!-- 咨询流程导航 -->
<div class="consultation-flow" id="flow-nav">
    <div class="step active" data-step="1">
        <div class="step-circle">1</div>
        <div class="step-label">品种定位</div>
        <div class="step-desc">确认原研/仿制、剂型、规格</div>
    </div>
    <div class="step" data-step="2">
        <div class="step-circle">2</div>
        <div class="step-label">竞品画像</div>
        <div class="step-desc">获取过评数、历史中标情况</div>
    </div>
    <div class="step" data-step="3">
        <div class="step-circle">3</div>
        <div class="step-label">价格沙盘</div>
        <div class="step-desc">录入挂网价、成本线</div>
    </div>
    <div class="step" data-step="4">
        <div class="step-circle">4</div>
        <div class="step-label">决策报告</div>
        <div class="step-desc">生成三维策略方案</div>
    </div>
</div>

<div class="container">
    <div class="chat-panel">
        <div class="chat-header">
            <div style="width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 8px var(--success)"></div>
            顾问在线 | 正在服务中
        </div>
        <div class="chat-messages" id="chat-box">
            <!-- 消息动态插入 -->
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" class="chat-input" placeholder="回复顾问的问题..." onkeypress="if(event.key==='Enter')sendMsg()">
            <button class="send-btn" id="send-btn" onclick="sendMsg()">发送</button>
        </div>
    </div>

    <div class="report-panel">
        <div class="report-header">
            <span>📊 决策分析面板</span>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" onclick="saveCurrentReport()">💾 存档</button>
                <button class="action-btn" onclick="window.print()">🖨️ 导出 PDF</button>
                <button class="action-btn" onclick="showHistory()">📚 历史</button>
            </div>
        </div>
        <div class="report-content" id="report-box">
            <div class="report-empty" id="report-placeholder">
                <p style="font-size: 16px; margin-bottom: 10px;">📝 分析流程与报告</p>
                <p style="font-size: 12px; max-width: 300px;">随着咨询推进，下方的流程图将实时变化，最终生成完整策略报告。</p>
            </div>
        </div>
    </div>
</div>

<script>
let sessionToken = "sess-" + Math.random().toString(36).substr(2, 9);
let isGenerating = false;

window.onload = () => {
    addMessage('ai', '您好，我是您的集采投标顾问。为了给您提供最具实操性的策略，我们需要先对品种进行精准定位。请告诉我您想分析的**药品通用名**是什么？（如：阿莫西林胶囊）', '第一步：品种定位。我们需要明确该品种的市场属性，这是制定所有策略的基石。');
};

function addMessage(role, text, tip = null) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = `message msg-${role}`;
    let html = role === 'ai' ? marked.parse(text) : text;
    if (tip) {
        html += `<div class="expert-tip">💡 顾问依据：${tip}</div>`;
    }
    div.innerHTML = html;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function addThinking(text) {
    const box = document.getElementById('chat-box');
    const div = document.createElement('div');
    div.className = 'thinking-log';
    div.id = 'temp-log';
    div.innerHTML = `> ${text}`;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
    return div;
}

function removeThinking(el) {
    if (el) el.remove();
}

function updateFlow(stepNum) {
    const steps = document.querySelectorAll('.step');
    steps.forEach((s, idx) => {
        const n = idx + 1;
        s.classList.remove('active', 'done');
        if (n < stepNum) s.classList.add('done');
        if (n === stepNum) s.classList.add('active');
    });
}

async function sendMsg() {
    const input = document.getElementById('chat-input');
    const text = input.value.trim();
    if (!text || isGenerating) return;

    addMessage('user', text);
    input.value = '';
    isGenerating = true;
    document.getElementById('send-btn').disabled = true;

    try {
        const logEl = addThinking('正在接入分析引擎...');
        
        const res = await fetch('/api/vbp_chat', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                session_id: sessionToken,
                user_input: text
            })
        });
        const data = await res.json();
        
        removeThinking(logEl);
        
        if (data.success) {
            addMessage('ai', data.reply, data.tip);
            updateFlow(data.step);
            document.getElementById('report-status').innerText = data.status || '处理中...';
            if (data.report) {
                document.getElementById('report-placeholder').style.display = 'none';
                const reportBox = document.getElementById('report-box');
                // 保存数据到全局供存档使用
                window.currentReportData = data.meta || {};
                
                // If flowchart exists, prepend it
                if (data.flowchart) {
                    reportBox.innerHTML = `<div id="flow-chart-box" class="mermaid">${data.flowchart}</div>` + marked.parse(data.report);
                } else {
                    reportBox.innerHTML = marked.parse(data.report);
                }
                document.getElementById('report-status').innerText = '✅ 报告已生成';
                // 渲染可视化图表
                try {
                    await mermaid.run({ nodes: reportBox.querySelectorAll('.mermaid') });
                } catch (e) { console.log("Mermaid render error", e); }
            } else if (data.flowchart) {
                 // Just update the flowchart if report is not ready yet
                 document.getElementById('report-placeholder').style.display = 'none';
                 let chartBox = document.getElementById('flow-chart-box');
                 if (!chartBox) {
                     chartBox = document.createElement('div');
                     chartBox.id = 'flow-chart-box';
                     chartBox.className = 'mermaid';
                     document.getElementById('report-box').prepend(chartBox);
                 }
                 chartBox.innerHTML = data.flowchart;
                 chartBox.removeAttribute('data-processed'); // reset mermaid
                 try {
                    await mermaid.run({ nodes: [chartBox] });
                 } catch (e) { console.log("Mermaid render error", e); }
            }
        } else {
            addMessage('ai', '系统错误: ' + data.error);
        }
    } catch (e) {
        addMessage('ai', '网络连接失败，请重试。');
    } finally {
        isGenerating = false;
        document.getElementById('send-btn').disabled = false;
    }
}

async function saveCurrentReport() {
    const reportBox = document.getElementById('report-box');
    const content = reportBox.innerText; // Get raw text for now, or use innerHTML
    
    // Get data from current state
    const data = window.currentReportData || {};
    const drugName = data.drug_name || "未命名";
    
    try {
        const res = await fetch('/api/reports/save', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                content: reportBox.innerHTML,
                drug_name: drugName,
                meta: data
            })
        });
        const result = await res.json();
        if (result.success) {
            alert("✅ 报告已存档！ID: " + result.id);
        } else {
            alert("❌ 存档失败: " + result.error);
        }
    } catch (e) {
        alert("❌ 网络错误");
    }
}

function showHistory() {
    fetch('/api/reports/list')
        .then(res => res.json())
        .then(data => {
            if (data.success) {
                openHistoryModal(data.reports);
            }
        });
}

function openHistoryModal(reports) {
    let listHtml = reports.map(r => `
        <div class="history-item">
            <div>
                <b>${r.title}</b>
                <div style="font-size: 11px; color: var(--text-dim); margin-top: 4px;">🎯 ${r.target || '通用'} | 📅 ${r.date}</div>
            </div>
        </div>
    `).join('');
    if (!reports.length) listHtml = '<p style="color: var(--text-dim); text-align: center;">暂无存档</p>';
    
    const modal = document.createElement('div');
    modal.className = 'modal-overlay';
    modal.innerHTML = `
        <div class="modal-content">
            <div class="modal-header">
                <h3>📚 历史报告存档</h3>
                <button class="close-btn" onclick="this.closest('.modal-overlay').remove()">✕</button>
            </div>
            <div class="history-list">${listHtml}</div>
        </div>
    `;
    document.body.appendChild(modal);
    modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

// Capture report data when it's generated
let originalFetch = window.fetch;
window.addEventListener('DOMContentLoaded', () => {
    const originalSend = sendMsg;
    // We patch the report generation to store data
});
</script>
</body>
</html>
