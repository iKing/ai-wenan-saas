# AI文案工坊 Nginx 配置
# 用途：反向代理 Flask 应用 + 静态资源服务 + HTTPS 跳转

server {
    listen 80;
    server_name ai365.vip www.ai365.vip;

    # 强制 HTTPS 跳转（待证书配置后启用）
    # return 301 https://$host$request_uri;

    # 日志
    access_log /var/log/nginx/aiwenan_access.log;
    error_log /var/log/nginx/aiwenan_error.log;

    # 反向代理到 Flask (localhost:5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 允许 WebSocket 升级（如果需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 超时设置（AI 生成可能需要较长时间）
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 静态资源缓存（可选，Flask 也能处理但 Nginx 更快）
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff2)$ {
        proxy_pass http://127.0.0.1:5000;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}

